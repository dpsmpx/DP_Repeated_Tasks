name: Smoke check ncurses frontend

on:
  push:
    paths:
      - 'DP_Rep_Tasks_ncs.cpp'
      - '.github/workflows/smoke-ncurses.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -std=c++98 -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined DP_Rep_Tasks_ncs.cpp -lncurses -o app
      - name: Interactive smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -f repeated_tasks.dat repeated_tasks.dat.tmp repeated_tasks.dat.bak
          printf 'aTest task\n\n\033qly\n' | TERM=xterm script -q -e -c 'stty cols 80 rows 24; ./app' /tmp/ncurses-smoke.log
          test -f repeated_tasks.dat
          grep -q '^RTASKS3$' repeated_tasks.dat
          grep -q '^Test task$' repeated_tasks.dat
          grep -q '^2$' repeated_tasks.dat
