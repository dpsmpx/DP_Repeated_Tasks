name: verify-ncurses-v3

on:
  push:
    paths:
      - 'DP_Rep_Tasks_ncs.cpp'
      - '.github/workflows/verify-ncurses-v3.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - name: Build C++98
        run: g++ -std=c++98 -Wall -Wextra -Wpedantic -O2 DP_Rep_Tasks_ncs.cpp -lncurses -o app
      - name: Build ASAN UBSAN
        run: g++ -std=c++98 -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined DP_Rep_Tasks_ncs.cpp -lncurses -o app_san
      - name: Static navigation and output checks
        run: |
          ! grep -q '\[Esc\]' DP_Rep_Tasks_ncs.cpp
          test $(grep -c "case 'b':" DP_Rep_Tasks_ncs.cpp) -ge 4
          test $(grep -c "ch == 'b'" DP_Rep_Tasks_ncs.cpp) -ge 6
          grep -q 'use_legacy_coding(2);' DP_Rep_Tasks_ncs.cpp
          grep -q 'static string displaySafe' DP_Rep_Tasks_ncs.cpp
          grep -q 'static void printUtf8At' DP_Rep_Tasks_ncs.cpp
          ! grep -q 'mvaddnwstr' DP_Rep_Tasks_ncs.cpp
          ! grep -q 'get_wch' DP_Rep_Tasks_ncs.cpp
      - name: Runtime UTF-8 and Android back-key smoke
        env:
          LANG: C
          LC_ALL: C
        run: |
          rm -f repeated_tasks.dat repeated_tasks.dat.tmp repeated_tasks.dat.bak
          printf '%s\n' 'RTASKS3' '2' '1' 'BEGIN' '1' 'Очень длинная русская задача для проверки правой границы терминала 1234567890' 'Описание не должно физически переноситься на следующую строку автоматически.' '1' '0' '0' '0' '0' '0' '0' 'END' > repeated_tasks.dat
          timeout 5s sh -c "printf '\n\n5bbbq' | TERM=xterm script -q -e -c 'stty cols 50 rows 24; ./app_san' /tmp/ncurses.log >/dev/null"
          grep -a -q 'Очень длинная' /tmp/ncurses.log
          grep -a -q 'СПИСОК ЗАДАЧ' /tmp/ncurses.log
          ! grep -a -q 'M-' /tmp/ncurses.log
          grep -a -q '^RTASKS3$' repeated_tasks.dat
