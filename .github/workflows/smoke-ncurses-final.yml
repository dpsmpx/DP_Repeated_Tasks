name: Final ncurses smoke check

on:
  push:
    paths:
      - 'DP_Rep_Tasks_ncs.cpp'
      - '.github/workflows/smoke-ncurses-final.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        run: g++ -std=c++98 -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined DP_Rep_Tasks_ncs.cpp -lncurses -o app
      - name: Interactive smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -f repeated_tasks.dat repeated_tasks.dat.tmp repeated_tasks.dat.bak
          printf 'j\nTest task\n\n\033q l\n' | TERM=xterm script -q -e -c 'stty cols 80 rows 24; ./app' /tmp/ncurses-smoke.log
          test -f repeated_tasks.dat
          echo "----- repeated_tasks.dat -----"
          cat -n repeated_tasks.dat
          echo "----- end repeated_tasks.dat -----"
          grep -Fxq 'RTASKS3' repeated_tasks.dat
          grep -Fxq 'Test task' repeated_tasks.dat
          awk 'NR == 2 { if ($0 != "2") exit 1 }' repeated_tasks.dat
