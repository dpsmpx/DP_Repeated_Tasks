name: verify-ncurses-v9

on:
  push:
    paths:
      - 'DP_Rep_Tasks_ncs.cpp'
      - '.github/workflows/verify-ncurses-v9.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - name: Build C++98 and sanitizers
        run: |
          g++ -std=c++98 -Wall -Wextra -Wpedantic -O2 DP_Rep_Tasks_ncs.cpp -lncurses -o app
          g++ -std=c++98 -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined DP_Rep_Tasks_ncs.cpp -lncurses -o app_san
      - name: Static renderer checks
        run: |
          ! grep -Eq '(^|[^.[:alnum:]_])(mvprintw|mvhline|mvvline|mvaddch|mvaddstr|printw|addstr|addch|refresh)[[:space:]]*\(' DP_Rep_Tasks_ncs.cpp
          ! grep -Eq '\b(get_wch|mvaddnwstr)\b' DP_Rep_Tasks_ncs.cpp
          ! grep -q '\[Esc\]' DP_Rep_Tasks_ncs.cpp
          grep -q '\[B\]' DP_Rep_Tasks_ncs.cpp
          grep -q 'static string displaySafe' DP_Rep_Tasks_ncs.cpp
          grep -q 'static void printUtf8At' DP_Rep_Tasks_ncs.cpp
          grep -q '\\033\[\?7l' DP_Rep_Tasks_ncs.cpp
          grep -q '\\033\[\?7h' DP_Rep_Tasks_ncs.cpp
      - name: Runtime UTF-8, B-back and no-wrap smoke
        env:
          LANG: C
          LC_ALL: C
        run: |
          rm -f repeated_tasks.dat repeated_tasks.dat.tmp repeated_tasks.dat.bak
          printf '%s\n' 'RTASKS3' '2' '1' 'BEGIN' '1' 'Очень длинная русская задача для проверки правой границы терминала 1234567890' 'Описание не должно физически переноситься на следующую строку автоматически.' '1' '0' '0' '0' '0' '0' '0' '0' 'END' > repeated_tasks.dat
          timeout 5s sh -c "printf '\n\n5bbbq' | TERM=xterm script -q -e -c 'stty cols 50 rows 24; ./app_san' /tmp/app.log >/dev/null"
          grep -a -q 'Очень длинная' /tmp/app.log
          grep -a -q 'СПИСОК ЗАДАЧ' /tmp/app.log
          grep -a -q 'ИСТОРИЯ ВЫПОЛНЕНИЙ' /tmp/app.log
          ! grep -a -q 'M-' /tmp/app.log
          grep -a -q '^RTASKS3$' repeated_tasks.dat
