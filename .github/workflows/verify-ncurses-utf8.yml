name: verify-ncurses-utf8

on:
  push:
    paths:
      - 'DP_Rep_Tasks_ncs.cpp'

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ncursesw
        run: sudo apt-get update && sudo apt-get install -y libncursesw5-dev
      - name: Build
        run: |
          g++ -std=c++98 -Wall -Wextra -Wpedantic -O2 DP_Rep_Tasks_ncs.cpp -lncursesw -o app
      - name: Build ASAN UBSAN
        run: |
          g++ -std=c++98 -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined DP_Rep_Tasks_ncs.cpp -lncursesw -o app_san
      - name: UTF-8 runtime smoke
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          rm -f repeated_tasks.dat repeated_tasks.dat.tmp repeated_tasks.dat.bak
          printf 'j\nТест\n\n\033s\n\nq\n' | TERM=xterm script -q -e -c 'stty cols 100 rows 30; ./app_san' /tmp/ncurses.log >/dev/null
          grep -a -q 'Тест' /tmp/ncurses.log
          test -f repeated_tasks.dat
          grep -a -q '^RTASKS3$' repeated_tasks.dat
          grep -a -q '^Тест$' repeated_tasks.dat
